src/
├── assets/                # Hình ảnh, biểu tượng, font, v.v.
│   └── logo.png
│
├── components/            # Các component dùng lại được (header, button, table...)
│   ├── common/            # Component chung (Button, Input, Modal...)
│   │   ├── Button.jsx
│   │   └── Modal.jsx
│   └── layout/            # Các thành phần giao diện cố định như Sidebar, Header
│       ├── Sidebar.jsx
│       └── Header.jsx
│
├── pages/                 # Các trang chính tương ứng với từng route
│   ├── Dashboard.jsx
│   ├── Movies.jsx
│   ├── Showtimes.jsx
│   ├── Tickets.jsx
│   └── Users.jsx
│
├── routes/                # Quản lý định tuyến
│   └── AppRoutes.jsx
│
├── App.jsx                # Thành phần gốc, chứa Router và layout chính
├── main.jsx               # Điểm khởi đầu của ứng dụng (render React vào HTML)
└── index.css              # CSS gốc hoặc import Tailwind ở đây (nếu dùng)
